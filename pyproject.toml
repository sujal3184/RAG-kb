[project]
name = "knowledge-base"
version = "1.0.0"
description = "Production-grade Knowledge Base with Advanced RAG"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115.0,<0.120.0",
    "uvicorn[standard]>=0.32.0,<0.36.0",
    "pydantic>=2.9.2,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "sqlalchemy[asyncio]>=2.0.35,<2.1.0",
    "asyncpg>=0.30.0,<0.31.0",
    "alembic>=1.13.3,<2.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "bcrypt>=4.0.1,<4.1.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "python-multipart>=0.0.12,<0.1.0",
    "pypdf>=5.1.0,<6.0.0",
    "pdfplumber>=0.11.4,<0.12.0",
    "python-docx>=1.1.2,<2.0.0",
    "beautifulsoup4>=4.12.3,<5.0.0",
    "lxml>=5.3.0,<6.0.0",
    "tiktoken>=0.8.0,<0.9.0",
    "sentence-transformers>=3.3.1,<4.0.0",
    "torch>=2.5.1,<3.0.0",
    "qdrant-client>=1.12.1,<1.13.0",
    "rank-bm25>=0.2.2,<0.3.0",
    "groq>=0.13.0,<1.0.0",
    "tenacity>=9.0.0,<10.0.0",
    "celery[redis]>=5.4.0,<6.0.0",
    "redis>=5.2.0,<6.0.0",
    "opentelemetry-api>=1.29.0,<2.0.0",
    "opentelemetry-sdk>=1.29.0,<2.0.0",
    "opentelemetry-exporter-otlp>=1.29.0,<2.0.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
    "opentelemetry-instrumentation-httpx>=0.50b0",
    "prometheus-client>=0.21.1,<0.22.0",
    "resend>=2.5.1,<3.0.0",
    "boto3>=1.35.0,<2.0.0",
    "cohere>=5.13.0,<6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3,<9.0.0",
    "pytest-asyncio>=0.24.0,<0.25.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "httpx>=0.27.2,<0.29.0",
    "ruff>=0.7.1,<0.9.0",
    "mypy>=1.13.0,<2.0.0",
    "reportlab>=4.2.5,<5.0.0",
]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "docker: tests that require `docker compose up` to be running",
    "embedding_model: tests that download and load real ML models (slow)",
    "external_api: tests that call a real external API and need credentials",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/main.py",
    "*/migrations/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true