services:
  app:
    build:
      target: builder
    command: >
      uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /build/app
    volumes:
      - ./app:/build/app
      - ./data/uploads:/build/data/uploads
      - ./data/models:/build/data/models
    ports:
      - "8000:8000"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - POSTGRES_HOST=postgres
      - QDRANT_HOST=qdrant
      - REDIS_HOST=redis

  celery_worker:
    build:
      target: builder
    command: >
      uv run celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ./app:/build/app
      - ./data/uploads:/build/data/uploads
      - ./data/models:/build/data/models
    environment:
      - POSTGRES_HOST=postgres
      - QDRANT_HOST=qdrant
      - REDIS_HOST=redis

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  qdrant:
    ports:
      - "6333:6333"
      - "6334:6334"

  prometheus:
    ports:
      - "9090:9090"

  grafana:
    ports:
      - "3001:3000"