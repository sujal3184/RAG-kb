services:
  app:
    build:
      target: builder  # use the stage that still has uv, for faster dev rebuilds
    command: >
      uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./app:/build/app        # live-reload: code changes reflect instantly
    ports:
      - "8000:8000"
    environment:
      - PYTHONDONTWRITEBYTECODE=1

  postgres:
    ports:
      - "5432:5432"   # exposed so you can connect with a DB tool like DBeaver/TablePlus

  redis:
    ports:
      - "6379:6379"

  qdrant:
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC API