
services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: kb_app
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - kb_network
    restart: unless-stopped
    volumes:
      - uploaded_files:/code/data/uploads 
      - model_cache:/code/data/models 

  postgres:
    image: postgres:16-alpine
    container_name: kb_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kb_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kb_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kb_network
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: kb_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # Qdrant doesn't ship curl/wget in its image, so we use its own
      # readiness endpoint via bash's built-in /dev/tcp trick instead.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kb_network
    restart: unless-stopped

  celery_worker:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: kb_celery_worker
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - uploaded_files:/code/data/uploads
      - model_cache:/code/data/models
    networks:
      - kb_network
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: kb_otel_collector
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./docker/otel/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    networks:
      - kb_network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: kb_prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - kb_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: kb_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./docker/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - kb_network
    restart: unless-stopped

networks:
  kb_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  uploaded_files:
  model_cache:
  prometheus_data:
  grafana_data: