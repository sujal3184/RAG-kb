name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kb_admin
          POSTGRES_PASSWORD: kb_test_password
          POSTGRES_DB: knowledge_base
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:v1.12.1
        ports: ["6333:6333"]

    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: kb_admin
      POSTGRES_PASSWORD: kb_test_password
      POSTGRES_DB: knowledge_base
      REDIS_HOST: localhost
      QDRANT_HOST: localhost
      SECRET_KEY: ci-only-secret-not-used-in-production
      GROQ_API_KEY: not-used-in-ci

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: |
          uv run ruff check app tests
          uv run mypy app

      - name: Run migrations
        run: uv run alembic upgrade head

      # Model-loading and external-API tests are excluded: they'd download
      # gigabytes of weights and require credentials, making CI slow and
      # flaky. Run those locally with -m embedding_model / -m external_api.
      - name: Run tests with coverage
        run: |
          uv run pytest -v -m "not embedding_model and not external_api" \
            --cov --cov-report=term-missing