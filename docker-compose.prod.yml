# Production overrides. Use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Key differences from development:
#   - No source code bind mounts (image is immutable)
#   - No --reload
#   - Database/Redis/Qdrant ports NOT exposed to the host
#   - Runs the production Dockerfile stage (non-root, no build tools)

services:
  app:
    build:
      target: runtime
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_JSON: "true"
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      QDRANT_HOST: qdrant
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 4G

  celery_worker:
    build:
      target: runtime
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    environment:
      ENVIRONMENT: production
      LOG_JSON: "true"
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      QDRANT_HOST: qdrant
    deploy:
      resources:
        limits:
          memory: 6G

  # Databases deliberately have NO ports section — they are reachable only
  # from within the Docker network, never from the host or internet.
  postgres:
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]

  qdrant: {}

  prometheus: {}

  grafana:
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"